<div id="reviewAddModal"
     class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
  <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
    <h3 class="text-lg font-bold mb-4 text-[#537FB9] font-[Kanit]">Add Your Review</h3>

        <form id="addReviewForm" data-event-id="">
      {% csrf_token %}
      <label class="block mb-2 text-gray-700 font-[Kanit]">Rating</label>
      <select name="rating" class="border-gray-300 rounded-md w-full mb-3 p-2 font-[Kanit]">
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="1">1</option>
      </select>

      <label class="block mb-2 text-gray-700 font-[Kanit]">Comment</label>
      <textarea name="komentar"
                class="w-full border-gray-300 rounded-md p-2 mb-4 font-[Kanit]"
                placeholder="Tulis review kamu..."></textarea>

      <div class="flex justify-end gap-3">
        <button type="button" onclick="closeAddModal()"
                class="bg-gray-300 text-gray-700 px-3 py-1 rounded-md font-[Kanit]">Cancel</button>
        <button type="submit"
                class="bg-[#537FB9] text-white px-3 py-1 rounded-md font-[Kanit]">Submit</button>
      </div>
    </form>
  </div>
</div>
