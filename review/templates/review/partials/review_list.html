{% if reviews %}
  {% for review in reviews %}
    {% include 'review/card_review.html' with review=review user=user event=event %}
  {% endfor %}
{% else %}
  <div class="text-center py-12">
    <div class="text-gray-400 mb-4">
      <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
      </svg>
    </div>
    <p class="text-gray-500 text-lg font-[Kanit] mb-2">No reviews yet</p>
    <p class="text-gray-400 text-sm">Be the first to share your experience!</p>
  </div>
{% endif %}
