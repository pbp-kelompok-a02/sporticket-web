<div class="bg-white shadow rounded-lg p-4 mb-3 border border-gray-100 font-[Kanit]" id="review-{{ review.id }}">
  <div class="flex justify-between items-center mb-1">
    <p class="font-semibold text-gray-800">{{ review.user.username }}</p>
    <span class="text-yellow-500">⭐ {{ review.rating }}/5</span>
  </div>
  <p class="text-gray-700">{{ review.komentar }}</p>
  <p class="text-sm text-gray-400">{{ review.created_at|date:"d M Y, H:i" }}</p>

  {% if user == review.user %}
  <div class="flex gap-3 mt-2">
    <button class="text-[#537FB9] text-sm hover:underline"
            onclick="openEditModal('{{ review.id }}', '{{ review.rating }}', `{{ review.komentar|escapejs }}`)">
      Edit
    </button>
    <button class="text-red-500 text-sm hover:underline"
            onclick="deleteReview('{{ review.id }}')">
      Delete
    </button>
  </div>
  {% endif %}
</div>
