<!-- Edit Profile Modal -->
<div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
    <div class="p-8">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-2xl font-semibold text-gray-800">Edit Profile</h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      
      <form id="editProfileForm" class="space-y-4 profile-form" enctype="multipart/form-data">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" name="name" value="{{ profile_user.profile.name }}" 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-[#537fb9] focus:border-[#537fb9]" required>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" name="email" value="{{ profile_user.email }}" 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-[#537fb9] focus:border-[#537fb9]" required>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700">Phone Number</label>
          <input type="tel" name="phone_number" value="{{ profile_user.profile.phone_number|default:'' }}" 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-[#537fb9] focus:border-[#537fb9]">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700">Profile Photo</label>
          <input type="file" name="profile_photo" accept="image/*" 
                 class="mt-1 block w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-[#537fb9] file:text-white hover:file:opacity-90">
          <p class="text-xs text-gray-500 mt-1">PNG, JPG, JPEG up to 5MB</p>
        </div>
        
        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-300 text-gray-700 px-4 py-3 rounded-lg font-semibold hover:bg-gray-400 transition-colors">
            Cancel
          </button>
          <button type="submit" class="flex-1 bg-[#537fb9] text-white px-4 py-3 rounded-lg font-semibold hover:opacity-90 transition-opacity">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Change Password Modal -->
<div id="changePasswordModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl max-w-md w-full">
    <div class="p-8">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-2xl font-semibold text-gray-800">Change Password</h3>
        <button onclick="closeChangePasswordModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      
      <form id="changePasswordForm" class="space-y-4 profile-form">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700">Current Password</label>
          <input type="password" name="current_password" required 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-[#537fb9] focus:border-[#537fb9]">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700">New Password</label>
          <input type="password" name="new_password" required 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-[#537fb9] focus:border-[#537fb9]">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700">Confirm New Password</label>
          <input type="password" name="new_password2" required 
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-[#537fb9] focus:border-[#537fb9]">
        </div>
        
        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeChangePasswordModal()" class="flex-1 bg-gray-300 text-gray-700 px-4 py-3 rounded-lg font-semibold hover:bg-gray-400 transition-colors">
            Cancel
          </button>
          <button type="submit" class="flex-1 bg-green-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors">
            Change Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete Account Modal -->
<div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl max-w-md w-full">
    <div class="p-8 text-center">
      <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </div>
      
      <h3 class="text-2xl font-semibold text-gray-800 mb-2">Delete Account</h3>
      <p class="text-gray-600 mb-6">
        Are you sure you want to delete your account? This action cannot be undone. All your data will be permanently removed.
      </p>
      
      <div class="flex gap-3">
        <button onclick="closeDeleteModal()" class="flex-1 bg-gray-300 text-gray-700 px-4 py-3 rounded-lg font-semibold hover:bg-gray-400 transition-colors">
          Cancel
        </button>
        <button onclick="confirmDelete()" class="flex-1 bg-red-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-red-700 transition-colors">
          Delete Account
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function openEditModal() {
  document.getElementById('editModal').classList.remove('hidden');
  document.getElementById('editModal').classList.add('flex');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
  document.getElementById('editModal').classList.remove('flex');
}

function openChangePasswordModal() {
  document.getElementById('changePasswordModal').classList.remove('hidden');
  document.getElementById('changePasswordModal').classList.add('flex');
}

function closeChangePasswordModal() {
  document.getElementById('changePasswordModal').classList.add('hidden');
  document.getElementById('changePasswordModal').classList.remove('flex');
  document.getElementById('changePasswordForm').reset();
}

function openDeleteModal() {
  document.getElementById('deleteModal').classList.remove('hidden');
  document.getElementById('deleteModal').classList.add('flex');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.add('hidden');
  document.getElementById('deleteModal').classList.remove('flex');
}

// edit profile F\form AJAX
document.getElementById('editProfileForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

  try {
    const response = await fetch("{% url 'account:profile_update' %}", {
      method: 'POST',
      headers: {
        'X-CSRFToken': csrfToken,
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: formData
    });

    const data = await response.json();
    
    if (data.success) {
      showToast({
        title: "Success",
        message: data.message || "Profile updated successfully!",
        type: "success"
      });
      closeEditModal();
      // update DOM in-place sehingga user melihat perubahannya tanpa reload
      try {
        if (data.data) {
          const d = data.data;
          // name
          const nameEls = document.querySelectorAll('[data-profile-name]');
          nameEls.forEach(el => el.textContent = d.name || el.textContent);
          // email
          const emailEls = document.querySelectorAll('[data-profile-email]');
          emailEls.forEach(el => el.textContent = d.email || el.textContent);
          // phone
          const phoneEls = document.querySelectorAll('[data-profile-phone]');
          phoneEls.forEach(el => el.textContent = d.phone_number || 'Not set');
          // photo
          if (d.profile_photo_url) {
            const photoEls = document.querySelectorAll('[data-profile-photo]');
            photoEls.forEach(img => {
              img.src = d.profile_photo_url;
              img.alt = 'Profile photo';
            });
          }
        }
      } catch (e) {
        console.warn('Could not update DOM in-place', e);
        setTimeout(() => location.reload(), 1000);
      }
    } else {
      showToast({
        title: "Error",
        message: data.message || "Failed to update profile.",
        type: "error"
      });
    }
  } catch (error) {
    console.error('Error:', error);
    showToast({
      title: "Network Error",
      message: 'Network error. Please try again.',
      type: "error"
    });
  }
});

// change password form AJAX
document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

  try {
    const response = await fetch("{% url 'account:change_password' %}", {
      method: 'POST',
      headers: {
        'X-CSRFToken': csrfToken,
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: formData
    });

    const data = await response.json();
    
    if (data.success) {
      showToast({
        title: "Success",
        message: data.message || "Password changed successfully!",
        type: "success"
      });
      closeChangePasswordModal();
      this.reset();
    } else {
      showToast({
        title: "Error",
        message: data.message || "Failed to change password.",
        type: "error"
      });
    }
  } catch (error) {
    console.error('Error:', error);
    showToast({
      title: "Network Error",
      message: 'Network error. Please try again.',
      type: "error"
    });
  }
});

// delete account
function confirmDelete() {
  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
  
  fetch("{% url 'account:delete_account' %}", {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrfToken,
      'X-Requested-With': 'XMLHttpRequest'
    }
  })
  .then(response => {
    if (response.ok) {
      showToast({
        title: "Success",
        message: "Account deleted successfully!",
        type: "success"
      });
      setTimeout(() => window.location.href = '/', 2000);
    } else {
      showToast({
        title: "Error",
        message: "Failed to delete account.",
        type: "error"
      });
    }
  })
  .catch(error => {
    console.error('Error:', error);
    showToast({
      title: "Network Error",
      message: 'Network error. Please try again.',
      type: "error"
    });
  });
}

// close modal saat klik di luar modal
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeEditModal();
});

document.getElementById('changePasswordModal').addEventListener('click', function(e) {
  if (e.target === this) closeChangePasswordModal();
});

document.getElementById('deleteModal').addEventListener('click', function(e) {
  if (e.target === this) closeDeleteModal();
});

// close modals saat tekan Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeEditModal();
    closeChangePasswordModal();
    closeDeleteModal();
  }
});
</script>
