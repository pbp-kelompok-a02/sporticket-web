<form id="editForm-{{ ticket.id }}" class="space-y-4">
  {% csrf_token %}
  <input type="hidden" name="event" value="{{ event.match_id }}">

  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700">Category</label>
    {{ form.category }}
  </div>

  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700">Price</label>
    {{ form.price }}
  </div>

  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700">Stock</label>
    {{ form.stock }}
  </div>

  <div class="flex justify-end gap-3">
    <button type="button" class="px-4 py-2 border rounded" onclick="closeEditModal()">Cancel</button>
    <button type="submit" form="editForm-{{ ticket.id }}" class="order-1 sm:order-2 flex-1 bg-[#537FB9] text-white px-6 py-3 rounded-md font-medium hover:bg-[#537FFF] transition-colors">Update</button>
  </div>
</form>
